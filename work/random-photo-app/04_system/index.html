<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ランダム写真</title>
<style>
  :root {
    --gold: #ffd54a;
    --gold-dark: #b8860b;
    --pink: #ff2e6d;
    --neon-blue: #00e5ff;
    --bg: #0a0612;
    --card: #1c1030;
    --card2: #241640;
    --text: #fff2e0;
    --muted: #9d8fc0;
    --border: #3a2a5c;
    --header-h: 56px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
    background: radial-gradient(circle at 50% -10%, #2a1448 0%, #0a0612 55%, #050208 100%);
    color: var(--text);
    max-width: 480px; margin: 0 auto; min-height: 100vh;
  }
  .screen { display: none; min-height: 100vh; padding-bottom: 24px; }
  .screen.active { display: block; }

  .header {
    background: linear-gradient(180deg, #2a0f45, #1a0a2e);
    color: var(--gold); height: var(--header-h);
    display: flex; align-items: center; padding: 0 16px;
    position: sticky; top: 0; z-index: 100; gap: 12px;
    border-bottom: 2px solid var(--gold-dark);
    box-shadow: 0 2px 12px rgba(255,213,74,0.15);
  }
  .header-back {
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.1); border-radius: 50%; cursor: pointer; font-size: 19px; flex-shrink: 0;
    color: var(--text);
  }
  .header-title {
    font-size: 17px; font-weight: 800; flex: 1; letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(255,213,74,0.7);
  }

  .section { padding: 16px; }

  /* HOME */
  .home-hero { text-align: center; padding: 44px 24px 20px; }
  .home-hero-icon {
    font-size: 58px; margin-bottom: 14px;
    filter: drop-shadow(0 0 14px rgba(255,213,74,0.8));
    animation: iconFloat 2.4s ease-in-out infinite;
  }
  @keyframes iconFloat {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-6px) rotate(3deg); }
  }
  .home-hero-count {
    display: inline-block; font-family: 'Courier New', monospace; font-size: 13px;
    background: #000; color: #4ade80; padding: 6px 18px; border-radius: 8px;
    border: 2px solid #222; letter-spacing: 2px; margin-bottom: 36px;
    box-shadow: inset 0 0 10px rgba(74,222,128,0.5), 0 0 8px rgba(74,222,128,0.35);
  }

  .random-btn {
    width: 190px; height: 190px; border-radius: 50%; border: 5px solid #fff2c0;
    background: radial-gradient(circle at 32% 28%, #fff2a8, #ffcf3d 45%, #ff2e6d 100%);
    color: #3a0d00; font-size: 18px; font-weight: 900; cursor: pointer; margin: 0 auto;
    display: flex; align-items: center; justify-content: center; line-height: 1.5;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
    box-shadow: 0 0 22px 6px rgba(255,180,0,0.55), 0 0 44px 12px rgba(255,46,109,0.35), inset 0 0 22px rgba(255,255,255,0.35);
    animation: btnPulse 1.8s ease-in-out infinite;
  }
  .random-btn:active { transform: scale(0.95); }
  @keyframes btnPulse {
    0%,100% { box-shadow: 0 0 22px 6px rgba(255,180,0,0.55), 0 0 44px 12px rgba(255,46,109,0.35), inset 0 0 22px rgba(255,255,255,0.35); }
    50%     { box-shadow: 0 0 32px 10px rgba(255,180,0,0.85), 0 0 58px 18px rgba(255,46,109,0.55), inset 0 0 26px rgba(255,255,255,0.45); }
  }

  .manage-link {
    display: block; text-align: center; margin-top: 36px; color: var(--neon-blue);
    font-size: 14px; font-weight: 700; cursor: pointer;
    text-shadow: 0 0 8px rgba(0,229,255,0.6);
  }

  /* MANAGE */
  .add-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .add-btn {
    flex: 1; background: var(--card); border: 2px dashed var(--gold-dark); border-radius: 14px;
    padding: 16px 8px; text-align: center; cursor: pointer;
  }
  .add-btn-icon { font-size: 26px; margin-bottom: 4px; }
  .add-btn-text { font-size: 12px; font-weight: 700; color: var(--gold); }

  .photo-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  .photo-thumb {
    aspect-ratio: 1; border-radius: 10px; overflow: hidden; position: relative;
    background: var(--card); border: 1px solid var(--border);
  }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-del {
    position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.7); color: var(--pink);
    border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    font-size: 13px; cursor: pointer;
  }

  .empty-state { text-align: center; padding: 48px 24px; color: var(--muted); }
  .empty-state-icon { font-size: 44px; margin-bottom: 10px; }

  /* RANDOM RESULT OVERLAY（当たり演出） */
  .overlay {
    position: fixed; inset: 0; z-index: 500;
    display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px;
    background: radial-gradient(circle, #2a123f 0%, #05020a 75%);
    overflow: hidden;
  }
  .overlay.open { display: flex; }
  .overlay::before {
    content: ''; position: absolute; inset: -60%; z-index: 0;
    background: repeating-conic-gradient(from 0deg, rgba(255,213,74,0.14) 0deg 6deg, transparent 6deg 18deg);
    animation: rayRotate 9s linear infinite;
  }
  @keyframes rayRotate { to { transform: rotate(360deg); } }

  .result-banner {
    position: relative; z-index: 2; color: var(--gold); font-size: 20px; font-weight: 900;
    margin-bottom: 16px; text-shadow: 0 0 12px rgba(255,213,74,0.8); opacity: 0; transition: opacity 0.3s;
    letter-spacing: 2px;
  }
  .result-frame {
    position: relative; z-index: 2; border: 6px solid var(--gold); border-radius: 16px;
    overflow: hidden; box-shadow: 0 0 28px 8px rgba(255,213,74,0.55), 0 0 56px 18px rgba(255,46,109,0.3);
    max-width: 100%;
  }
  .result-frame img { display: block; max-width: 100%; max-height: 58vh; object-fit: contain; background:#000; }
  .result-frame img.spinning { filter: blur(1.5px) brightness(1.4); }
  .result-frame.reveal { animation: zoomFlash 0.45s ease-out; }
  @keyframes zoomFlash {
    0%   { transform: scale(0.7); filter: brightness(3); }
    60%  { transform: scale(1.06); filter: brightness(1.3); }
    100% { transform: scale(1); filter: brightness(1); }
  }

  .overlay-actions { position: relative; z-index: 2; display: flex; gap: 12px; margin-top: 22px; width: 100%; max-width: 320px; }
  .overlay-btn {
    flex: 1; padding: 14px; border-radius: 14px; border: none; font-size: 15px; font-weight: 800;
    cursor: pointer; font-family: inherit;
  }
  .overlay-btn.again {
    background: linear-gradient(135deg,#ffcf3d,#ff2e6d); color: #2b0700;
    box-shadow: 0 0 16px rgba(255,150,50,0.5);
  }
  .overlay-btn.close { background: rgba(255,255,255,0.1); color: var(--text); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1e1030; color: var(--gold); padding: 12px 20px; border-radius: 24px;
    font-size: 14px; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 9999; white-space: nowrap;
    border: 1px solid var(--gold-dark);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ─── HOME ─── -->
<div class="screen active" id="screen-home">
  <div class="header"><div class="header-title">🎰 ランダム写真</div></div>
  <div class="home-hero">
    <div class="home-hero-icon">📸</div>
    <div class="home-hero-count" id="photo-count">STOCK: 0枚</div>
    <button class="random-btn" onclick="showRandomPhoto()">🎲<br>スタート</button>
    <div class="manage-link" onclick="goScreen('manage')">写真を管理する ›</div>
  </div>
</div>

<!-- ─── MANAGE ─── -->
<div class="screen" id="screen-manage">
  <div class="header">
    <div class="header-back" onclick="goScreen('home')">‹</div>
    <div class="header-title">写真を管理</div>
  </div>
  <div class="section">
    <div class="add-row">
      <div class="add-btn" onclick="document.getElementById('camera-input').click()">
        <div class="add-btn-icon">📷</div>
        <div class="add-btn-text">写真を撮る</div>
      </div>
      <div class="add-btn" onclick="document.getElementById('library-input').click()">
        <div class="add-btn-icon">🖼</div>
        <div class="add-btn-text">アルバムから選ぶ</div>
      </div>
    </div>
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" onchange="handleFiles(event)">
    <input type="file" id="library-input" accept="image/*" multiple style="display:none" onchange="handleFiles(event)">
    <div class="photo-grid" id="photo-grid"></div>
  </div>
</div>

<!-- ─── RANDOM RESULT ─── -->
<div class="overlay" id="result-overlay">
  <div class="result-banner" id="result-banner">🎉 これだ！ 🎉</div>
  <div class="result-frame" id="result-frame">
    <img id="result-img" src="" alt="">
  </div>
  <div class="overlay-actions">
    <button class="overlay-btn again" onclick="showRandomPhoto()">🎲 もう一回</button>
    <button class="overlay-btn close" onclick="closeResult()">閉じる</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────────
//  IndexedDB（写真がたくさん増える前提なのでlocalStorageではなくIndexedDBを使用）
// ─────────────────────────────────────────────
const DB_NAME = 'random_photo_db';
const STORE_NAME = 'photos';
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function addPhoto(dataUrl) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).add({ src: dataUrl, addedAt: Date.now() });
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

function getAllPhotos() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function deletePhotoById(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

// ─────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────
function showToast(msg, duration = 2200) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

function goScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  if (name === 'manage') renderPhotoGrid();
  if (name === 'home') refreshCount();
  window.scrollTo(0, 0);
}

function resizeImage(file, callback) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1000;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ─────────────────────────────────────────────
//  写真の追加・表示・削除
// ─────────────────────────────────────────────
async function handleFiles(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  for (const file of files) {
    await new Promise(res => {
      resizeImage(file, async dataUrl => {
        await addPhoto(dataUrl);
        res();
      });
    });
  }
  showToast(`📷 写真${files.length}枚を追加しました`);
  renderPhotoGrid();
  e.target.value = '';
}

async function renderPhotoGrid() {
  const photos = await getAllPhotos();
  const el = document.getElementById('photo-grid');
  if (!photos.length) {
    el.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">📭</div><div>まだ写真がありません</div></div>`;
    return;
  }
  el.innerHTML = photos.map(p => `
    <div class="photo-thumb">
      <img src="${p.src}">
      <div class="photo-del" onclick="removePhoto(${p.id})">✕</div>
    </div>`).join('');
}

async function removePhoto(id) {
  await deletePhotoById(id);
  renderPhotoGrid();
  showToast('🗑️ 削除しました');
}

async function refreshCount() {
  const photos = await getAllPhotos();
  document.getElementById('photo-count').textContent = `STOCK: ${photos.length}枚`;
}

// ─────────────────────────────────────────────
//  ランダム表示（スロット風の演出）
// ─────────────────────────────────────────────
let spinTimer = null;

async function showRandomPhoto() {
  const photos = await getAllPhotos();
  if (!photos.length) { showToast('⚠️ まだ写真が登録されていません'); return; }

  const overlay = document.getElementById('result-overlay');
  const img = document.getElementById('result-img');
  const frame = document.getElementById('result-frame');
  const banner = document.getElementById('result-banner');

  clearInterval(spinTimer);
  overlay.classList.add('open');
  frame.classList.remove('reveal');
  banner.style.opacity = 0;
  img.classList.add('spinning');

  let ticks = 0;
  const maxTicks = 16;
  spinTimer = setInterval(() => {
    const r = photos[Math.floor(Math.random() * photos.length)];
    img.src = r.src;
    ticks++;
    if (ticks >= maxTicks) {
      clearInterval(spinTimer);
      const finalPick = photos[Math.floor(Math.random() * photos.length)];
      img.src = finalPick.src;
      img.classList.remove('spinning');
      // reflow をはさんでからアニメーションを付け直す
      frame.classList.remove('reveal');
      void frame.offsetWidth;
      frame.classList.add('reveal');
      banner.style.opacity = 1;
    }
  }, 80);
}

function closeResult() {
  clearInterval(spinTimer);
  document.getElementById('result-overlay').classList.remove('open');
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
openDB().then(d => { db = d; refreshCount(); });
</script>
</body>
</html>
