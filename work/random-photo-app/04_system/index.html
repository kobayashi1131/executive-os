<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ランダム写真</title>
<style>
  :root {
    --primary: #1a56db;
    --primary-dark: #1239a5;
    --danger: #ef4444;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --header-h: 56px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
    background: var(--bg); color: var(--text);
    max-width: 480px; margin: 0 auto; min-height: 100vh;
  }
  .screen { display: none; min-height: 100vh; padding-bottom: 24px; }
  .screen.active { display: block; }

  .header {
    background: var(--primary); color: white; height: var(--header-h);
    display: flex; align-items: center; padding: 0 16px;
    position: sticky; top: 0; z-index: 100; gap: 12px;
  }
  .header-back {
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.15); border-radius: 50%; cursor: pointer; font-size: 19px; flex-shrink: 0;
  }
  .header-title { font-size: 17px; font-weight: 700; flex: 1; }

  .section { padding: 16px; }

  /* HOME */
  .home-hero { text-align: center; padding: 40px 24px 20px; }
  .home-hero-icon { font-size: 56px; margin-bottom: 12px; }
  .home-hero-count { font-size: 14px; color: var(--muted); margin-bottom: 28px; }
  .random-btn {
    width: 180px; height: 180px; border-radius: 50%; border: none;
    background: linear-gradient(135deg,#1a56db,#1239a5); color: white;
    font-size: 17px; font-weight: 800; cursor: pointer; margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(26,86,219,0.4); line-height: 1.4;
  }
  .random-btn:active { transform: scale(0.96); }
  .manage-link {
    display: block; text-align: center; margin-top: 32px; color: var(--primary);
    font-size: 14px; font-weight: 700; cursor: pointer;
  }

  /* MANAGE */
  .add-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .add-btn {
    flex: 1; background: #f8faff; border: 2px dashed #93c5fd; border-radius: 14px;
    padding: 16px 8px; text-align: center; cursor: pointer;
  }
  .add-btn-icon { font-size: 26px; margin-bottom: 4px; }
  .add-btn-text { font-size: 12px; font-weight: 700; color: var(--primary); }

  .photo-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  .photo-thumb {
    aspect-ratio: 1; border-radius: 10px; overflow: hidden; position: relative; background: #e0f2fe;
  }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-del {
    position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.6); color: white;
    border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    font-size: 13px; cursor: pointer;
  }

  .empty-state { text-align: center; padding: 48px 24px; color: var(--muted); }
  .empty-state-icon { font-size: 44px; margin-bottom: 10px; }

  /* RANDOM RESULT OVERLAY */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 500;
    display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px;
  }
  .overlay.open { display: flex; }
  .overlay img { max-width: 100%; max-height: 70vh; border-radius: 12px; object-fit: contain; }
  .overlay-actions { display: flex; gap: 12px; margin-top: 20px; width: 100%; max-width: 320px; }
  .overlay-btn {
    flex: 1; padding: 14px; border-radius: 14px; border: none; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .overlay-btn.again { background: var(--primary); color: white; }
  .overlay-btn.close { background: rgba(255,255,255,0.15); color: white; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1e293b; color: white; padding: 12px 20px; border-radius: 24px;
    font-size: 14px; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 9999; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ─── HOME ─── -->
<div class="screen active" id="screen-home">
  <div class="header"><div class="header-title">🎲 ランダム写真</div></div>
  <div class="home-hero">
    <div class="home-hero-icon">📸</div>
    <div class="home-hero-count" id="photo-count">登録写真：0枚</div>
    <button class="random-btn" onclick="showRandomPhoto()">🎲<br>ランダム表示</button>
    <div class="manage-link" onclick="goScreen('manage')">写真を管理する ›</div>
  </div>
</div>

<!-- ─── MANAGE ─── -->
<div class="screen" id="screen-manage">
  <div class="header">
    <div class="header-back" onclick="goScreen('home')">‹</div>
    <div class="header-title">写真を管理</div>
  </div>
  <div class="section">
    <div class="add-row">
      <div class="add-btn" onclick="document.getElementById('camera-input').click()">
        <div class="add-btn-icon">📷</div>
        <div class="add-btn-text">写真を撮る</div>
      </div>
      <div class="add-btn" onclick="document.getElementById('library-input').click()">
        <div class="add-btn-icon">🖼</div>
        <div class="add-btn-text">アルバムから選ぶ</div>
      </div>
    </div>
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" onchange="handleFiles(event)">
    <input type="file" id="library-input" accept="image/*" multiple style="display:none" onchange="handleFiles(event)">
    <div class="photo-grid" id="photo-grid"></div>
  </div>
</div>

<!-- ─── RANDOM RESULT ─── -->
<div class="overlay" id="result-overlay">
  <img id="result-img" src="" alt="">
  <div class="overlay-actions">
    <button class="overlay-btn again" onclick="showRandomPhoto()">🎲 もう一回</button>
    <button class="overlay-btn close" onclick="closeResult()">閉じる</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────────
//  IndexedDB（写真がたくさん増える前提なのでlocalStorageではなくIndexedDBを使用）
// ─────────────────────────────────────────────
const DB_NAME = 'random_photo_db';
const STORE_NAME = 'photos';
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function addPhoto(dataUrl) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).add({ src: dataUrl, addedAt: Date.now() });
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

function getAllPhotos() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function deletePhotoById(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

// ─────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────
function showToast(msg, duration = 2200) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

function goScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  if (name === 'manage') renderPhotoGrid();
  if (name === 'home') refreshCount();
  window.scrollTo(0, 0);
}

function resizeImage(file, callback) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1000;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ─────────────────────────────────────────────
//  写真の追加・表示・削除
// ─────────────────────────────────────────────
async function handleFiles(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  let loaded = 0;
  for (const file of files) {
    await new Promise(res => {
      resizeImage(file, async dataUrl => {
        await addPhoto(dataUrl);
        loaded++;
        res();
      });
    });
  }
  showToast(`📷 写真${files.length}枚を追加しました`);
  renderPhotoGrid();
  e.target.value = '';
}

async function renderPhotoGrid() {
  const photos = await getAllPhotos();
  const el = document.getElementById('photo-grid');
  if (!photos.length) {
    el.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">📭</div><div>まだ写真がありません</div></div>`;
    return;
  }
  el.innerHTML = photos.map(p => `
    <div class="photo-thumb">
      <img src="${p.src}">
      <div class="photo-del" onclick="removePhoto(${p.id})">✕</div>
    </div>`).join('');
}

async function removePhoto(id) {
  await deletePhotoById(id);
  renderPhotoGrid();
  showToast('🗑️ 削除しました');
}

async function refreshCount() {
  const photos = await getAllPhotos();
  document.getElementById('photo-count').textContent = `登録写真：${photos.length}枚`;
}

async function showRandomPhoto() {
  const photos = await getAllPhotos();
  if (!photos.length) { showToast('⚠️ まだ写真が登録されていません'); return; }
  const pick = photos[Math.floor(Math.random() * photos.length)];
  document.getElementById('result-img').src = pick.src;
  document.getElementById('result-overlay').classList.add('open');
}

function closeResult() {
  document.getElementById('result-overlay').classList.remove('open');
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
openDB().then(d => { db = d; refreshCount(); });
</script>
</body>
</html>
