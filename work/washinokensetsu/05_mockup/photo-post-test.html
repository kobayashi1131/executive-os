<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>写真送信テスト</title>
<!--
  案件写真の共有（設計書 4-5）の確認用。
  スマホのブラウザから写真用GASへ写真を送り、返事（fileId）を読めるか、取り出せるかを確かめる。
  GASのURLと合言葉は画面で入力する。このファイルには書かない。
  使うのはテスト用GAS（phototest2 など）。本番のGAS_URLは入れないこと。
-->
<style>
:root{--bg:#F6F8FA;--surface:#fff;--text:#1F2933;--muted:#5B677A;--primary:#102A43;--ok:#15803D;--ng:#B42318;--border:rgba(16,42,67,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1117;--surface:#1a1e28;--text:#E5E7EB;--muted:#AAB4C0;--primary:#7CB7E8;--ok:#4ADE80;--ng:#F87171;--border:rgba(255,255,255,.12)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Hiragino Sans','Yu Gothic UI',sans-serif;font-size:16px;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--muted);margin:8px 0 4px}
input[type=text],input[type=password]{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
button{width:100%;padding:12px;margin-top:12px;border:0;border-radius:10px;background:var(--primary);color:var(--surface);font-weight:700;font-size:16px}
button:disabled{opacity:.5}
ul{list-style:none;padding:0;margin:0}
li{padding:6px 0;border-bottom:1px solid var(--border);font-size:15px}
li:last-child{border-bottom:0}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--ng);font-weight:700}.mu{color:var(--muted)}
img{max-width:100%;border-radius:8px;margin-top:8px}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>写真送信テスト</h1>

  <div class="card">
    <label for="url">テスト用GASのURL（…/exec で終わるもの）</label>
    <input id="url" type="text" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">
    <label for="secret">合言葉</label>
    <input id="secret" type="password" autocomplete="off">
    <label for="file">写真</label>
    <input id="file" type="file" accept="image/*">
    <button id="run">送ってみる</button>
  </div>

  <div class="card">
    <ul id="checks"></ul>
    <img id="back" alt="" hidden>
    <pre id="detail"></pre>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);

function line(text, ok) {
  const li = document.createElement('li');
  const mark = ok === true ? '<span class="ok">OK</span> ' : ok === false ? '<span class="ng">NG</span> ' : '<span class="mu">…</span> ';
  li.innerHTML = mark + text;
  $('checks').appendChild(li);
}

// アプリと同じ縮小（長い辺800px・画質72%）
function resize(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX = 800;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else       { w = Math.round(w * MAX / h); h = MAX; }
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = r.result;
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// 設計書 4-5：text/plain で送る（application/json だと事前確認の通信が出てGASが受けない）
async function post(url, body) {
  const t0 = performance.now();
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  const text = await res.text();
  const sec = ((performance.now() - t0) / 1000).toFixed(1);
  if (!text || text.trim().charAt(0) !== '{') throw new Error('JSON以外が返った（' + sec + '秒）: ' + text.slice(0, 200));
  return { json: JSON.parse(text), sec };
}

function envChecks() {
  line('この端末：' + navigator.userAgent.replace(/[<>]/g, ''), null);
  line('安全な接続（https）：' + (window.isSecureContext ? 'はい' : 'いいえ'), window.isSecureContext);
  line('写真の指紋づくり（crypto.subtle）が使える', !!(window.crypto && crypto.subtle));
  line('大きめの保存場所（IndexedDB）が使える', !!window.indexedDB);
}

$('run').onclick = async () => {
  const url = $('url').value.trim();
  const secret = $('secret').value;
  const file = $('file').files[0];
  $('checks').innerHTML = ''; $('detail').textContent = ''; $('back').hidden = true;
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) { line('URLの形が違う（…/exec で終わるGASのURLを入れる）', false); return; }
  if (!file) { line('写真を選んでください', false); return; }

  $('run').disabled = true;
  envChecks();
  try {
    const dataUrl = await resize(file);
    const b64 = dataUrl.split(',')[1];
    line('縮小後の大きさ：約' + Math.round(b64.length * 3 / 4 / 1024) + 'KB', true);

    const up = await post(url, { action: 'uploadPhoto', secret, projectId: 'browser-test', filename: 'browser-test.jpg', dataBase64: b64 });
    if (!up.json.success) throw new Error('uploadPhotoが失敗を返した: ' + up.json.error);
    line('送信して、返事（fileId）を読めた（' + up.sec + '秒）', true);

    const got = await post(url, { action: 'getPhoto', secret, fileId: up.json.fileId });
    if (!got.json.success) throw new Error('getPhotoが失敗を返した: ' + got.json.error);
    const same = got.json.dataBase64 === b64;
    line('取り出せた（' + got.sec + '秒）。送った写真と' + (same ? '一致' : '不一致'), same);
    $('back').src = 'data:image/jpeg;base64,' + got.json.dataBase64;
    $('back').hidden = false;

    const bad = await post(url, { action: 'getPhoto', secret: secret + 'x', fileId: up.json.fileId });
    line('合言葉が違うと断られる', bad.json.success === false);
  } catch (e) {
    line('止まった：' + String(e.message || e).replace(/[<>]/g, ''), false);
    $('detail').textContent = String(e.stack || '');
  } finally {
    $('run').disabled = false;
  }
};
</script>
</body>
</html>
